x-redis: &redis
  image: redis:7-alpine
  command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec"]
  healthcheck:
    test: ["CMD", "redis-cli", "ping"]
    interval: 2s
    timeout: 2s
    retries: 15

x-server: &server
  build: ./server
  environment: &server-env
    CENTRAL_URL: http://central:9000

services:
  central:
    build: ./mock_central
    ports: ["9000:9000"]

  redis-a:
    <<: *redis
    volumes: ["redis-a-data:/data"]
  server-a:
    <<: *server
    environment:
      <<: *server-env
      GROUP_NAME: gSPAa
      PUBLIC_URL: http://server-a:8000
      REDIS_URL: redis://redis-a:6379/0
    depends_on:
      redis-a: {condition: service_healthy}
      central: {condition: service_started}
    ports: ["8000:8000"]

  redis-b:
    <<: *redis
    volumes: ["redis-b-data:/data"]
  server-b:
    <<: *server
    environment:
      <<: *server-env
      GROUP_NAME: gSPAb
      PUBLIC_URL: http://server-b:8000
      REDIS_URL: redis://redis-b:6379/0
    depends_on:
      redis-b: {condition: service_healthy}
      central: {condition: service_started}
    ports: ["8001:8000"]

volumes:
  redis-a-data:
  redis-b-data:

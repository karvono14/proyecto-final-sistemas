
services:
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 15

  server:
    build: ./server
    environment:
      GROUP_NAME: ${GROUP_NAME:?defina GROUP_NAME (ej. gSPAa)}
      PUBLIC_URL: ${PUBLIC_URL:?defina PUBLIC_URL}
      CENTRAL_URL: ${CENTRAL_URL:?defina CENTRAL_URL}
      REDIS_URL: redis://redis:6379/0
    depends_on:
      redis:
        condition: service_healthy
    ports:
      - "${HOST_PORT:-8000}:8000"

volumes:
  redis-data:

